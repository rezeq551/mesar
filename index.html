<style>
  :root{
    --ink:#1B2A28;
    --ink-soft:#5B6B66;
    --paper:#EFF2ED;
    --paper-raised:#FFFFFF;
    --primary:#146356;
    --primary-deep:#0E4A40;
    --accent:#E8A33D;
    --secondary:#4A6FA5;
    --border:#DCE1D8;
    --radius:16px;
    --shadow:0 2px 10px rgba(20,99,86,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Aref Ruqaa',serif;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--accent);color:var(--ink);}

  #app{max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;background:var(--paper-raised);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:38px;height:38px;border-radius:10px;background:var(--primary);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Aref Ruqaa',serif;font-size:20px;font-weight:700;flex-shrink:0;
  }
  .brand .name{font-family:'Aref Ruqaa',serif;font-size:22px;font-weight:700;color:var(--primary-deep);}
  .brand .tag{font-size:11px;color:var(--ink-soft);margin-top:-2px;}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;justify-content:flex-end;}
  .who .pill{
    background:var(--paper);border:1px solid var(--border);border-radius:999px;
    padding:5px 12px;display:flex;align-items:center;gap:6px;
  }
  .who .edit-link, .who .logout-link{color:var(--secondary);font-weight:700;text-decoration:none;background:none;padding:4px;}
  .who .logout-link{color:#B23A48;}
  .admin-pill{background:var(--accent);color:var(--ink);font-weight:700;font-size:12px;padding:6px 14px;border-radius:999px;}

  main{flex:1;display:flex;flex-direction:column;}

  .onboard-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 18px;}
  .onboard-card{
    background:var(--paper-raised);border:1px solid var(--border);
    border-radius:20px;box-shadow:var(--shadow);padding:36px 30px;
    max-width:480px;width:100%;
  }
  .onboard-card h1{font-size:30px;margin:0 0 6px;color:var(--primary-deep);}
  .onboard-card p.lead{color:var(--ink-soft);margin:0 0 26px;line-height:1.9;font-size:15px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-weight:700;font-size:13px;margin-bottom:8px;color:var(--ink);}
  .field input[type=text],.field input[type=password],.field input[type=email]{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);
    font-size:15px;background:var(--paper);outline:none;transition:.15s;
  }
  .field input[type=text]:focus,.field input[type=password]:focus,.field input[type=email]:focus{border-color:var(--primary);background:#fff;}
  .role-toggle{display:flex;gap:10px;}
  .role-btn{
    flex:1;padding:14px 10px;border-radius:12px;border:1.5px solid var(--border);
    background:var(--paper);text-align:center;font-weight:700;font-size:13.5px;color:var(--ink-soft);
    transition:.15s;line-height:1.5;
  }
  .role-btn.active{border-color:var(--primary);background:rgba(20,99,86,0.08);color:var(--primary-deep);}
  select.major-select{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);
    background:var(--paper);font-size:14.5px;outline:none;
  }
  .hidden{display:none !important;}
  .primary-btn{
    width:100%;padding:14px;border-radius:12px;background:var(--primary);color:#fff;
    font-weight:700;font-size:15.5px;margin-top:8px;transition:.15s;
  }
  .primary-btn:hover{background:var(--primary-deep);}
  .primary-btn:disabled{opacity:.5;cursor:not-allowed;}
  .secondary-btn{
    width:100%;padding:13px;border-radius:12px;background:none;border:1.5px solid var(--border);
    color:var(--ink);font-weight:700;font-size:14.5px;margin-top:10px;
  }
  .secondary-btn:hover{border-color:var(--primary);color:var(--primary-deep);}
  .err-msg{color:#B23A48;font-size:13px;margin-top:6px;display:none;}
  .small-link{background:none;color:var(--secondary);font-size:12.5px;text-decoration:underline;display:block;text-align:center;margin-top:12px;}

  .home-wrap{padding:22px 18px 60px;}

  .home-hero h2{font-size:26px;margin:0 0 6px;color:var(--primary-deep);}
  .home-hero p{color:var(--ink-soft);margin:0;font-size:14.5px;line-height:1.8;max-width:640px;}
  .search-box{position:relative;margin:20px 0 28px;}

    background:var(--paper-raised);font-size:14.5px;outline:none;box-shadow:var(--shadow);
  }
  .search-box input:focus{border-color:var(--primary);}

  .quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .quick-action-btn{
    background:var(--paper-raised);border:1.5px solid var(--border);padding:10px 18px;
    border-radius:12px;font-weight:700;font-size:13.5px;color:var(--primary-deep);box-shadow:var(--shadow);
  }
  .quick-action-btn:hover{border-color:var(--primary);}

  .fields-grid{display:grid;grid-template-columns:1fr;gap:22px;}
  @media(min-width:760px){.fields-grid{grid-template-columns:1fr 1fr;}}

  .field-line{
    background:var(--paper-raised);border:1px solid var(--border);border-radius:18px;
    padding:18px 18px 8px;box-shadow:var(--shadow);
  }
  .field-line-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .field-dot{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:14px;flex-shrink:0;font-family:'Aref Ruqaa',serif;}
  .field-line-head h3{margin:0;font-size:18px;}
  .track{position:relative;padding-right:14px;border-right:2.5px solid var(--border);margin-right:15px;}
  .spec-row{

    display:flex;align-items:center;justify-content:space-between;gap:8px;

  .spec-row:hover{background:var(--paper);}

    content:'';position:absolute;right:-19.5px;top:50%;transform:translateY(-50%);
    width:9px;height:9px;border-radius:50%;background:var(--paper-raised);border:2.5px solid var(--border);
  }
  .spec-row.pinned::before{border-color:var(--accent);background:var(--accent);}
  .spec-name-btn{background:none;text-align:right;font-size:14.5px;font-weight:500;color:var(--ink);flex:1;padding:2px 0;}
  .spec-meta{font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .pin-btn{background:none;color:var(--border);font-size:16px;padding:2px 4px;flex-shrink:0;}
  .pin-btn.active{color:var(--accent);}

  .pinned-section{margin-bottom:26px;}
  .pinned-section h3{font-size:15px;color:var(--ink-soft);margin:0 0 10px;font-weight:700;font-family:'Tajawal';}
  .pinned-chips{display:flex;flex-wrap:wrap;gap:8px;}

    background:var(--paper-raised);border:1.5px solid var(--accent);color:var(--primary-deep);
    padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow);

  .room-wrap{flex:1;display:flex;flex-direction:column;}
  .room-header{

  .back-btn{background:none;color:var(--secondary);font-weight:700;font-size:13.5px;padding:4px 0 8px;display:flex;align-items:center;gap:4px;}
  .room-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .room-title-row h2{margin:0;font-size:21px;color:var(--primary-deep);}
  .room-breadcrumb{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .experts-row{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .experts-label{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .expert-chip{

  .lock-toggle-btn{background:var(--paper);border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink);}
  .lock-toggle-btn.locked{background:rgba(178,58,72,0.1);color:#B23A48;border-color:rgba(178,58,72,0.3);}

  .room-banner{margin:14px 18px 0;padding:12px 16px;border-radius:12px;font-size:13.5px;text-align:center;}
  .room-banner.locked{background:rgba(178,58,72,0.08);color:#B23A48;border:1px solid rgba(178,58,72,0.25);}
  .room-banner.muted{background:rgba(232,163,61,0.14);color:#8a5c14;border:1px solid rgba(232,163,61,0.35);}

  .messages{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
  .empty-state{text-align:center;margin:auto;padding:30px;color:var(--ink-soft);max-width:340px;}
  .empty-state .display{font-size:22px;color:var(--primary-deep);margin-bottom:8px;}
  .msg{max-width:78%;}
  .msg.mine{align-self:flex-start;}
  .msg-head{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap;}
  .msg-name{font-weight:700;font-size:13px;color:var(--ink);}
  .msg-badge{background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .msg-role-hs{color:var(--ink-soft);font-size:11px;}
  .msg-time{font-size:10.5px;color:var(--ink-soft);}
  .msg-bubble{
    background:var(--paper-raised);border:1px solid var(--border);border-radius:14px 14px 14px 4px;

  .mute-btn:hover{background:rgba(178,58,72,0.1);color:#B23A48;}

  .composer{
    padding:12px 16px;background:var(--paper-raised);border-top:1px solid var(--border);
    position:sticky;bottom:0;display:flex;gap:10px;align-items:flex-end;

  .composer textarea{
    flex:1;resize:none;border:1.5px solid var(--border);border-radius:14px;padding:11px 14px;
    font-size:14.5px;outline:none;max-height:120px;background:var(--paper);
  }
  .composer textarea:focus{border-color:var(--primary);background:#fff;}
  .composer textarea:disabled{opacity:.5;}
  .send-btn{
    background:var(--primary);color:#fff;width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:.15s;
  }
  .send-btn:hover{background:var(--primary-deep);}
  .send-btn:disabled{opacity:.4;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;
    z-index:100;opacity:0;pointer-events:none;transition:.25s;
  }
  .toast.show{opacity:1;bottom:30px;}

  .setup-banner{
    background:#B23A48;color:#fff;padding:12px 18px;font-size:13.5px;text-align:center;line-height:1.7;
  }
  .setup-banner code{background:rgba(255,255,255,.2);padding:1px 6px;border-radius:5px;}

  .admin-section{margin-top:20px;}
  .admin-section h3{font-size:16px;color:var(--primary-deep);margin:20px 0 12px;font-family:'Tajawal';font-weight:700;}
  .admin-room-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--paper-raised);font-size:14px;}

  .admin-add-exam{background:var(--paper-raised);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:24px;box-shadow:var(--shadow);}
  .admin-add-exam h3{margin:0 0 14px;font-size:16px;color:var(--primary-deep);font-family:'Tajawal';font-weight:700;}

  .exam-card{background:var(--paper-raised);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);}
  .exam-card h3{margin:6px 0 6px;font-size:16px;color:var(--ink);}
  .exam-card p{margin:0 0 10px;font-size:13.5px;color:var(--ink-soft);line-height:1.7;}
  .exam-spec-tag{background:rgba(20,99,86,0.08);color:var(--primary-deep);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}
  .exam-open-btn{display:inline-block;background:var(--primary);color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;}
  .exam-open-btn:hover{background:var(--primary-deep);}

  @media(max-width:600px){
    .brand .tag{display:none;}
    .who .pill span.role-txt{display:none;}
  }
</style>
</head>

/* ---------------------------------------------------------
   المصادقة والملف الشخصي (Firebase Authentication + Firestore)
--------------------------------------------------------- */
async function checkIsAdmin(uid){
  if(!db) return false;
  try{ const snap = await getDoc(doc(db,'admins',uid)); return snap.exists(); }
  catch(e){ return false; }
}
async function fetchUserProfile(uid){
  if(!db) return null;
  try{
    const snap = await getDoc(doc(db,'users',uid));
    return snap.exists() ? snap.data() : null;
  }catch(e){ return null; }
}
async function saveUserProfile(uid, data){
  if(!db) return;
  try{ await setDoc(doc(db,'users',uid), data, {merge:true}); }
  catch(e){ showToast('تعذّر حفظ البيانات، حاول مرة أخرى'); }
}

function initAuth(){
  if(!auth){ renderAuthLanding(); return; }
  onAuthStateChanged(auth, async (user)=>{
    if(user){
      currentUser = user;
      isAdminUser = await checkIsAdmin(user.uid);
      let p = await fetchUserProfile(user.uid);
      if(!p){
        p = {name: (user.email||'مستخدم').split('@')[0], role:'hs', majorId:'', pinned:[], createdAt:Date.now()};
        await saveUserProfile(user.uid, p);
      }
      profile = p;
      renderWho();
      renderHome();
    }else{
      currentUser = null;
      isAdminUser = false;
      profile = null;
      renderWho();
      renderAuthLanding();
    }
  });
}

async function muteUser(uid, name){
  if(!uid){ showToast('تعذّر تحديد المستخدم'); return; }
  const choice = window.prompt(
    'كتم "' + name + '" — اكتب رقم الخيار:\n1) ساعة\n2) يوم\n3) 3 أيام\n4) أسبوع\n5) إلغاء الكتم عنه', '2'
  );
  if(!choice) return;
  const map = {'1':3600000,'2':86400000,'3':3*86400000,'4':7*86400000};
  try{
    if(choice.trim()==='5'){
      await deleteDoc(doc(db,'mutes',uid));
      showToast('تم إلغاء الكتم');
    }else if(map[choice.trim()]){
      await setDoc(doc(db,'mutes',uid), {mutedUntil: Date.now()+map[choice.trim()], mutedBy:profile.name, name, ts:Date.now()});
      showToast('تم كتم المستخدم');
    }
  }catch(e){ showToast('تعذّر تنفيذ العملية'); }
}

function timeAgo(ts){
  const diff = Math.max(0, Date.now()-ts);
  const m = Math.floor(diff/60000);
  if(m<1) return 'الآن';
  if(m<60) return m+' د';
  const h = Math.floor(m/60);
  if(h<24) return h+' س';
  return Math.floor(h/24)+' يوم';
}

}
async function fetchRoomMeta(specId){
  if(!db) return {expertNames:[], locked:false};
  try{
    const snap = await getDoc(doc(db,'rooms',specId));
    if(!snap.exists()) return {expertNames:[], locked:false};
    const d = snap.data();
    return {expertNames:d.expertNames||[], locked:!!d.locked};
  }catch(e){ return {expertNames:[], locked:false}; }
}
async function checkMyMute(){
  if(!db || !currentUser) return null;
  try{
    const snap = await getDoc(doc(db,'mutes',currentUser.uid));
    if(snap.exists() && snap.data().mutedUntil > Date.now()) return snap.data();
    return null;
  }catch(e){ return null; }
}

async function renderRoom(specId){
  stopListening();
  currentRoom = specId;
  const spec = specById(specId);
  const field = fieldById(spec.fieldId);

  mainEl.innerHTML = `
    <div class="room-wrap">
      <div class="room-header">
        <button class="back-btn" id="backBtn">→ رجوع لكل التخصصات</button>
        <div class="room-title-row">
          <div>
            <h2>${esc(spec.name)}</h2>
            <div class="room-breadcrumb">${esc(field.name)} • غرفة نقاش خاصة بهذا التخصص</div>
          </div>
          <div id="roomLockBtnWrap"></div>
        </div>
        <div class="experts-row" id="expertsRow"></div>
      </div>
      <div id="roomBannerWrap"></div>
      <div class="messages" id="messagesBox"></div>
      <div class="composer">
        <textarea id="msgInput" rows="1" placeholder="اسأل سؤالك أو شارك تجربتك بـ ${esc(spec.name)}..." ${db?'':'disabled'}></textarea>
        <button class="send-btn" id="sendBtn" ${db?'':'disabled'}>↑</button>
      </div>
    </div>
  `;
  document.getElementById('backBtn').onclick = ()=> renderHome();

  if(!db){
    document.getElementById('messagesBox').innerHTML = '<div class="empty-state"><div class="display">الدردشة غير مفعّلة بعد</div><p>اربط مشروع Firebase أولاً من أعلى ملف الكود.</p></div>';
    return;
  }

  await registerExpert(specId);
  const meta = await fetchRoomMeta(specId);
  const expRow = document.getElementById('expertsRow');
  expRow.innerHTML = meta.expertNames.length
    ? '<span class="experts-label">طلاب فعليون بهذا التخصص:</span>' + meta.expertNames.slice(-8).map(n=>`<span class="expert-chip">${esc(n)}</span>`).join('')
    : '<span class="experts-label">ولا طالب جامعي مسجل هون بعد — كن أول من ينوّر الطريق 🌱</span>';

  const lockWrap = document.getElementById('roomLockBtnWrap');
  if(isAdminUser){
    lockWrap.innerHTML = `<button class="lock-toggle-btn small ${meta.locked?'locked':''}" id="roomLockBtn">${meta.locked?'🔒 افتح الغرفة':'🔓 اقفل الغرفة'}</button>`;
    document.getElementById('roomLockBtn').onclick = async ()=>{
      try{
        await setDoc(doc(db,'rooms',specId), {locked: !meta.locked}, {merge:true});
        showToast(!meta.locked?'تم قفل الغرفة':'تم فتح الغرفة');
        renderRoom(specId);
      }catch(e){ showToast('تعذّر تنفيذ العملية'); }
    };
  }

  const myMute = await checkMyMute();
  const bannerWrap = document.getElementById('roomBannerWrap');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  let composerDisabled = false;

  if(meta.locked && !isAdminUser){
    bannerWrap.innerHTML = '<div class="room-banner locked">🔒 هاي الغرفة مقفولة مؤقتًا من قبل الإدارة، ما فيك ترسل رسائل هلق — بس تقدر تقرأ.</div>';
    composerDisabled = true;
  }else if(myMute){
    const until = new Date(myMute.mutedUntil).toLocaleString('ar');
    bannerWrap.innerHTML = `<div class="room-banner muted">🔇 تم كتمك من قبل الإدارة حتى ${esc(until)}.</div>`;
    composerDisabled = true;
  }
  if(composerDisabled){ input.disabled = true; sendBtn.disabled = true; }

  const box = document.getElementById('messagesBox');
  const q = query(collection(db,'rooms',specId,'messages'), orderBy('ts','asc'), limit(200));
  unsubscribeMessages = (q, (snapshot)=>{
    const msgs = snapshot.docs.map(d=>d.data());
    if(!msgs.length){
      box.innerHTML = '<div class="empty-state"><div class="display">لسا ما في نقاش هون</div><p>كن أول من يبدأ! اسأل عن طبيعة التخصص، سوق العمل، أو صعوبة المواد.</p></div>';
      return;
    }
    box.innerHTML = msgs.map(m=>{
      const isExpert = m.role==='uni' && m.majorId===specId;
      return `
        <div class="msg">
          <div class="msg-head">
            <span class="msg-name">${esc(m.name)}</span>
            ${isExpert ? '<span class="msg-badge">✓ طالب/ة التخصص</span>' : '<span class="msg-role-hs">طالب/ة ثانوية</span>'}
            <span class="msg-time">${timeAgo(m.ts)}</span>
            ${isAdminUser ? `<button class="mute-btn" data-uid="${esc(m.uid||'')}" data-name="${esc(m.name)}">🔇 كتم</button>` : ''}
          </div>
          <div class="msg-bubble">${esc(m.text)}</div>
        </div>`;
    }).join('');
    if(isAdminUser){
      box.querySelectorAll('.mute-btn').forEach(btn=>{
        btn.onclick = ()=> muteUser(btn.getAttribute('data-uid'), btn.getAttribute('data-name'));
      });
    }
    box.scrollTop = box.scrollHeight;
  }, (err)=>{
    box.innerHTML = '<div class="empty-state"><div class="display">تعذّر تحميل الرسائل</div><p>تأكد من قواعد Firestore وإعدادات المشروع.</p></div>';
  });

  input.oninput = ()=>{ input.style.height='auto'; input.style.height=Math.min(120,input.scrollHeight)+'px'; };

async function send(){
    const text = input.value.trim();
    if(!text) return;

    // 🗑️ كود أمر الحذف للمشرفين
    if (text.startsWith('/delete') && isAdminUser) {
        try {
            const args = text.trim().split(' ');
            const deleteLimit = args[1] ? parseInt(args[1]) : 20;

            const messagesRef = collection(db, 'rooms', specId, 'messages');
            const qDel = query(messagesRef, orderBy('ts', 'desc'), limit(deleteLimit));
            const snapshot = await getDocs(qDel);

            const deletePromises = snapshot.docs.map(docSnap => deleteDoc(docSnap.ref));
            await Promise.all(deletePromises);

            showToast('تم حذف الرسائل بنجاح 🗑️');
        } catch (e) {
            console.error(e);
            showToast('تعذر تنفيذ أمر الحذف');
        }
        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = composerDisabled;
        return; 
    }

    // 💬 كود الإرسال العادي للرسائل
    if(!currentUser){ showToast('في تأخير بالاتصال، جرب كمان شوي'); return; }
    sendBtn.disabled = true;
    try{
      await addDoc(collection(db,'rooms',specId,'messages'), {
        name:profile.name, role:profile.role, majorId:profile.majorId, text, ts:Date.now(), uid:currentUser.uid
      });
      input.value=''; input.style.height='auto';
    }catch(e){
      showToast('تعذّر إرسال الرسالة، حاول مرة أخرى');
    }
    sendBtn.disabled = composerDisabled;
  }
  input.onkeydown = (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } };
}

/* ---------------------------------------------------------
   نقطة البداية
--------------------------------------------------------- */
mainEl.innerHTML = '<div class="onboard-wrap"><p style="color:var(--ink-soft)">جارِ التحميل...</p></div>';
initAuth();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* silent */ });
  });
}
</script>
</body>
